name: Weekly Analytics Report

on:
  schedule:
    # Run every Monday at 9:00 AM UTC (2:30 PM IST)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Weekly Analytics Report to Multiple Recipients
        run: |
          # Split comma-separated emails and send to each
          IFS=',' read -ra EMAILS <<< "${{ secrets.REPORT_EMAIL }}"
          for email in "${EMAILS[@]}"; do
            email=$(echo "$email" | xargs) # Trim whitespace
            echo "Sending report to: $email"
            curl -X POST "https://neunet-ai-services.onrender.com/api/auth/analytics/send-weekly-report?recipient_email=$email&days=7" \
              -H "Content-Type: application/json"
          done
